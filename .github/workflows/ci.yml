name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  conformance:
    name: conformance (fmt/clippy/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "conformance -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  benchmarks:
    name: benchmarks (fmt/clippy/check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "benchmarks -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --benches

  fuzzing-lib:
    name: fuzzing (lib fmt/clippy/check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuzzing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  compose-config:
    name: testnet/devnet compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f testnet/docker-compose.yml config -q
      - run: docker compose -f devnet/docker-compose.yml config -q
