name: openfiat-testnet

services:
  bootstrap-node:
    image: ghcr.io/openfiat-org/openfiat-node:latest
    env_file:
      - ./node.env
    volumes:
      - openfiat-testnet-data:/data
    ports:
      - "4001:4001/udp" # libp2p (QUIC)
      - "7080:7080/tcp" # JSON-RPC, WebSocket, REST, health, metrics — one port
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  openfiat-testnet-data:
