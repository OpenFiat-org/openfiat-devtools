name: openfiat-testnet

services:
  bootstrap-node:
    image: ghcr.io/openfiat-org/openfiat-node:latest
    command: ["--config", "/etc/openfiat/node.toml", "--genesis", "/etc/openfiat/genesis.json"]
    volumes:
      - ./node.toml:/etc/openfiat/node.toml:ro
      - ./genesis.json:/etc/openfiat/genesis.json:ro
    ports:
      - "30333:30333"   # OFNP peer port
      - "9944:9944"     # RPC port
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
